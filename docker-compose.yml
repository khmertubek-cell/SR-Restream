services:
  relay:
    build: .
    container_name: hls-relay
    restart: unless-stopped
    init: true
    env_file: .env
    expose:
      - "5081"
    volumes:
      - ./data:/app/data
      - ./hls:/app/hls
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: hls-relay-caddy
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
